name: Trigger auto deployment for newsletter-app

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ careersignal-rebrand ]
    paths:
    - '**'
    - '.github/workflows/newsletter-app-AutoDeployTrigger-04fafdc3-3ef8-48f9-8465-988232dc61bb.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.NEWSLETTERAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.NEWSLETTERAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.NEWSLETTERAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: linklaunchnewsletter.azurecr.io
          registryUsername: ${{ secrets.NEWSLETTERAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.NEWSLETTERAPP_REGISTRY_PASSWORD }}
          containerAppName: newsletter-app
          resourceGroup: linklaunch-newsletter-rg
          imageToBuild: linklaunchnewsletter.azurecr.io/newsletter-app:${{ github.sha }}


